name: Deploy

# main push → Vercel 本番（docs/requirements.md §16.2）。PR プレビューは行わない。
# Git 連携は使わず Vercel CLI でデプロイする（組織リポジトリ + Hobby プランの制約）。
# Hobby は commit author = チーム所有者のデプロイしか受け付けないため、api / web ジョブでは
# チェックアウト上で author を所有者に書き換えてから deploy する（§16.2）。
# API → Web の順で実行する（Web の rewrites はビルド時に API_ORIGIN を読む）。
# DB マイグレーションはこのワークフローでは行わない。ローカルから手で当てる（§16.2）。
on:
  push:
    branches: [main]
    paths:
      - "apps/**"
      - "packages/**"
      - "pnpm-lock.yaml"
      - "package.json"
      - "turbo.json"
      - ".github/workflows/deploy.yml"

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

env:
  VERCEL_CLI_VERSION: 59.5.0
  VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}

jobs:
  api:
    name: Deploy API
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 10
    env:
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID_API }}
    steps:
      - uses: actions/checkout@v7
      # Vercel Hobby チームは commit author がチーム所有者でないとデプロイが BLOCKED になり、
      # CLI は BLOCKED を終端扱いしないため「Building…」のまま固まる（docs/requirements.md §16.2）。
      # CI の使い捨てチェックアウト上でだけ author を所有者に書き換える（リポジトリの履歴は変えない）。
      # 元の SHA は deploy 時の --meta originalSha で Vercel 側に残す。
      - name: Rewrite commit author for Vercel Hobby check
        run: git -c user.name="Takuya Uehara" -c user.email="119403405+ut42tech@users.noreply.github.com" commit --amend --no-edit --reset-author
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm add -g vercel@${{ env.VERCEL_CLI_VERSION }}
      - name: Pull Vercel project settings / env
        run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}
      - name: Build
        run: vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}
      - name: Deploy
        run: vercel deploy --prebuilt --prod --meta originalSha=${{ github.sha }} --token=${{ secrets.VERCEL_TOKEN }}

  web:
    name: Deploy Web
    needs: api
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 10
    env:
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID_WEB }}
    steps:
      - uses: actions/checkout@v7
      # Vercel Hobby チームは commit author がチーム所有者でないとデプロイが BLOCKED になり、
      # CLI は BLOCKED を終端扱いしないため「Building…」のまま固まる（docs/requirements.md §16.2）。
      # CI の使い捨てチェックアウト上でだけ author を所有者に書き換える（リポジトリの履歴は変えない）。
      # 元の SHA は deploy 時の --meta originalSha で Vercel 側に残す。
      - name: Rewrite commit author for Vercel Hobby check
        run: git -c user.name="Takuya Uehara" -c user.email="119403405+ut42tech@users.noreply.github.com" commit --amend --no-edit --reset-author
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm add -g vercel@${{ env.VERCEL_CLI_VERSION }}
      - name: Pull Vercel project settings / env
        run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}
      # Web のビルドは環境変数を静的に焼き込む（NEXT_PUBLIC_* はクライアント JS へ、
      # API_ORIGIN は next.config.ts の rewrites へ）。Vercel で Sensitive 属性を付けた変数は
      # pull / build に復号されず リテラル "[SENSITIVE]" が渡るため、NEXT_PUBLIC_* に
      # Sensitive を付けるとビルドが落ちるか、黙って壊れた本番が出来上がる（2026-08-27 の障害）。
      # next build が不親切なプリレンダーエラーで落ちる前に、ここで原因を名指しして止める。
      - name: Verify pulled build-time env
        run: |
          env_file=.vercel/.env.production.local
          if [ ! -f "$env_file" ]; then
            echo "::error title=vercel pull failed::$env_file がありません。vercel pull が本番環境を取得できていません。"
            exit 1
          fi
          read_env() {
            grep -E "^$1=" "$env_file" | tail -n1 | cut -d= -f2- | sed -e 's/^"//' -e 's/"$//'
          }
          mode=$(read_env NEXT_PUBLIC_API_MODE)
          api_origin=$(read_env API_ORIGIN)
          fail=0
          if [ "$mode" != "http" ]; then
            echo "::error title=NEXT_PUBLIC_API_MODE が不正::受け取った値 '$mode'。本番は 'http' 必須（docs/requirements.md §17）。Vercel の dopamin-web プロジェクトで Sensitive を外した平文の環境変数として登録し直してください。"
            fail=1
          fi
          case "$api_origin" in
            https://*) ;;
            *)
              echo "::error title=API_ORIGIN が不正::受け取った値 '$api_origin'。https:// で始まる API のオリジンが必要です（next.config.ts の rewrites がビルド時に読みます）。Sensitive 属性が付いていないか確認してください。"
              fail=1
              ;;
          esac
          [ "$fail" -eq 0 ] || exit 1
          echo "NEXT_PUBLIC_API_MODE=$mode / API_ORIGIN=$api_origin"
      - name: Build
        # API_ORIGIN は Vercel プロジェクトに設定した固定値を使う
        run: vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}
      - name: Deploy
        run: vercel deploy --prebuilt --prod --meta originalSha=${{ github.sha }} --token=${{ secrets.VERCEL_TOKEN }}
